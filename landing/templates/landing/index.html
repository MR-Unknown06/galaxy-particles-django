{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{% static 'landing/css/style.css' %}">
</head>
<body>

  <header class="nav">
    <a class="nav__brand" href="{% url 'landing:index' %}">{{ brand }}</a>

    <nav class="nav__links" aria-label="Primary">
      {% for link in nav_links %}
        <a href="#">{{ link }}</a>
      {% endfor %}
      <button class="nav__search" type="button" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </nav>

    <div class="nav__actions">
      <div class="dropdown">
        <button class="pill pill--dark" id="login-btn" type="button" aria-haspopup="true" aria-expanded="false">
          Log in
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <ul class="dropdown__menu" id="login-menu" hidden>
          {% for item in login_menu %}
            <li><a href="{{ item.url }}">{{ item.label }}</a></li>
          {% endfor %}
        </ul>
      </div>
      <a class="pill pill--light" href="#">
        Try ChatGPT
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>
    </div>
  </header>

  <main class="hero">
    <canvas id="galaxy" aria-hidden="true"></canvas>
    <h1 class="hero__title" aria-label="GPT Astra">
      <span class="hero__word hero__word--left">GPT</span>
      <span class="hero__word hero__word--right">Astra</span>
    </h1>
  </main>

  <button class="replay" id="replay" type="button" aria-label="Replay animation">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  </button>

  {{ galaxy_config|json_script:"galaxy-config" }}
  <script src="{% static 'landing/js/galaxy.js' %}"></script>
  <script src="{% static 'landing/js/ui.js' %}"></script>
</body>
</html>
